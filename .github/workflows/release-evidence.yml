name: Release evidence

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Audit release dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag provenance
        shell: bash
        run: |
          set -euo pipefail
          package_version=$(python -c \
            'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$GITHUB_REF_NAME" = "v$package_version"
          git fetch --force --no-tags origin main \
            "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag
          test "$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Install release verification tooling
        run: >-
          python -m pip install --disable-pip-version-check
          -e ".[dev]" pip-audit==2.10.1
      - name: Re-run source, catalog, metadata, and coverage gates
        run: |
          ruff check .
          PYTHONPATH=src python scripts/validate_catalog.py
          scripts/check-counts
          PYTHONPATH=src python scripts/check_release_ready.py --skip-build
          pytest --cov=freellmpool --cov-branch \
            --cov-report=term-missing --cov-report=json:.coverage.json
          python scripts/check_coverage.py .coverage.json
      - name: Require zero open high-severity code-scanning alerts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          high_alerts=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/code-scanning/alerts?state=open&severity=high&per_page=100" \
            --jq '.[].number')
          critical_alerts=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/code-scanning/alerts?state=open&severity=critical&per_page=100" \
            --jq '.[].number')
          if test -n "$high_alerts$critical_alerts"; then
            echo "Open high/critical code-scanning alerts block release." >&2
            printf 'high: %s\ncritical: %s\n' "$high_alerts" "$critical_alerts" >&2
            exit 1
          fi
      - name: Validate exceptions and audit release dependencies
        shell: bash
        run: |
          set -euo pipefail
          python scripts/security_exceptions.py validate
          mapfile -t ignored < <(python scripts/security_exceptions.py ids pip-audit)
          args=()
          for advisory in "${ignored[@]}"; do
            args+=(--ignore-vuln "$advisory")
          done
          python -m pip_audit . --strict --desc=on --aliases=on "${args[@]}"

  packages:
    name: Package SBOMs and provenance
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Revalidate release tag provenance
        shell: bash
        run: |
          set -euo pipefail
          package_version=$(python -c \
            'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$GITHUB_REF_NAME" = "v$package_version"
          git fetch --force --no-tags origin main \
            "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag
          test "$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Install pinned build tooling
        run: >-
          python -m pip install
          --disable-pip-version-check
          build==1.5.0
          twine==7.0.0
      - name: Build wheel and source archive
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check dist/*.whl dist/*.tar.gz
      - name: Resolve exact artifacts
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t wheels < <(find dist -maxdepth 1 -type f -name '*.whl' -print)
          mapfile -t sdists < <(find dist -maxdepth 1 -type f -name '*.tar.gz' -print)
          test "${#wheels[@]}" -eq 1
          test "${#sdists[@]}" -eq 1
          echo "wheel=${wheels[0]}" >> "$GITHUB_OUTPUT"
          echo "sdist=${sdists[0]}" >> "$GITHUB_OUTPUT"

      - name: Generate wheel SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          file: ${{ steps.artifacts.outputs.wheel }}
          format: spdx-json
          output-file: dist/wheel.spdx.json
          syft-version: v1.50.0
          upload-artifact: false
          upload-release-assets: false
      - name: Generate source archive SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          file: ${{ steps.artifacts.outputs.sdist }}
          format: spdx-json
          output-file: dist/sdist.spdx.json
          syft-version: v1.50.0
          upload-artifact: false
          upload-release-assets: false

      - name: Attest package provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Attest wheel SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ steps.artifacts.outputs.wheel }}
          sbom-path: dist/wheel.spdx.json
      - name: Attest source archive SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ steps.artifacts.outputs.sdist }}
          sbom-path: dist/sdist.spdx.json

      - name: Upload package evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-release-evidence-${{ github.ref_name }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.spdx.json
          if-no-files-found: error
          retention-days: 90

  container:
    name: Container SBOM and provenance
    needs: packages
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
      security-events: read
    uses: ./.github/workflows/docker.yml
