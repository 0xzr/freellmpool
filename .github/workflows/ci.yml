name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quickstart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Cold quickstart
        run: FREELLMPOOL_QUICKSTART_PACKAGE=. scripts/quickstart-test.sh

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Validate catalog
        run: python scripts/validate_catalog.py
      - name: Check public count claims
        run: scripts/check-counts
      - name: Release metadata readiness
        run: python scripts/check_release_ready.py --skip-build
      - name: Proxy stress smoke
        run: python scripts/stress_proxy.py --profile ci
      - name: Type check focused helpers
        run: mypy src/freellmpool/routing_modes.py src/freellmpool/catalog_validation.py src/freellmpool/_version.py
      - name: Import smoke
        run: python -c "import freellmpool; from freellmpool import Pool, AsyncPool; print(freellmpool.__version__, Pool, AsyncPool)"
      - name: Test
        run: |
          pytest --cov=freellmpool --cov-branch --cov-report=term-missing --cov-report=json:.coverage.json
          python scripts/check_coverage.py .coverage.json
      - name: Wheel smoke
        run: |
          python -m build
          python -m venv /tmp/freellmpool-wheel-smoke
          /tmp/freellmpool-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/freellmpool-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/freellmpool-wheel-smoke/bin/python -c "import freellmpool; from freellmpool import Pool, AsyncPool; print(freellmpool.__version__, Pool, AsyncPool)"
          /tmp/freellmpool-wheel-smoke/bin/freellmpool --version
          FREELLMPOOL_CONFIG_FILE=/tmp/flp-smoke-config.toml \
          FREELLMPOOL_QUOTA_PATH=/tmp/flp-smoke-quota.json \
          FREELLMPOOL_CACHE_PATH=/tmp/flp-smoke-cache.db \
          FREELLMPOOL_EXTERNAL_CATALOG_PATH=/tmp/flp-smoke-external.json \
            /tmp/freellmpool-wheel-smoke/bin/freellmpool doctor

  docker-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Build and smoke-test the container
        run: |
          set -euo pipefail
          image="freellmpool:ci-${{ github.sha }}"
          container="freellmpool-ci-${{ github.run_id }}-${{ github.run_attempt }}"

          cleanup() {
            exit_code=$?
            set +e
            if test "$exit_code" -ne 0; then
              docker logs "$container"
            fi
            docker rm --force "$container" >/dev/null 2>&1
            docker image rm "$image" >/dev/null 2>&1
            exit "$exit_code"
          }
          trap cleanup EXIT

          docker build --tag "$image" .
          docker run --rm --entrypoint python "$image" -c \
            'import os, sys, freellmpool; assert sys.version_info[:2] == (3, 14); assert freellmpool.__version__; assert os.getuid() != 0'
          docker run --rm "$image" --version
          docker run --detach --name "$container" --publish 127.0.0.1:18080:8080 "$image"

          healthy=false
          for attempt in $(seq 1 30); do
            if response=$(curl --fail --silent http://127.0.0.1:18080/healthz) && \
              python -c 'import json, sys; payload = json.loads(sys.argv[1]); assert payload["status"] == "ok"' "$response"; then
              healthy=true
              break
            fi
            sleep 1
          done
          test "$healthy" = true
