# Kilo Gateway: keyless OpenAI-compatible aggregator of FREE models (200 req/hr per IP,
# no key). Models carry a provider/ prefix (handled by _parse_model's first-slash split,
# same as openrouter). Note: free routes may log prompts — don't send confidential data.
# Model set re-validated 2026-07-14. The previously slow 550B Nemotron returned
# three real completions in 0.60-0.84s and is enabled again. Laguna XS.2 was
# retired and replaced by XS 2.1; Hy3 was added after repeated non-empty probes.
[[provider]]
id = "kilo"
label = "Kilo Gateway (keyless)"
adapter = "openai"
base_url = "https://api.kilo.ai/api/gateway"
auth = "none"
models = [
    { name = "openrouter/free", rpd = 0 },
    { name = "kilo-auto/free", rpd = 0 },
    { name = "poolside/laguna-m.1:free", rpd = 0, enabled = false },
    { name = "poolside/laguna-xs-2.1:free", rpd = 0 },
    { name = "stepfun/step-3.7-flash:free", rpd = 0 },
    { name = "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free", rpd = 0 },
    { name = "nvidia/nemotron-3-super-120b-a12b:free", rpd = 0 },
    { name = "nvidia/nemotron-3-ultra-550b-a55b:free", rpd = 0 },
    { name = "cohere/north-mini-code:free", rpd = 0 },
    { name = "tencent/hy3:free", rpd = 0, enabled = false },
    { name = "kwaipilot/kat-coder-pro-v2.5:free", rpd = 0, enabled = false },
]

