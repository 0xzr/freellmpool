# Vercel AI Gateway: the Hobby team receives $5/month of recurring gateway
# credit. These are the highest Artificial Analysis-rated models currently in
# its live catalog. One request/model/day is a conservative spend hint; actual
# use is metered in tokens. Models and pricing checked 2026-07-19.
[[provider]]
id = "vercel"
label = "Vercel AI Gateway"
adapter = "openai"
base_url = "https://ai-gateway.vercel.sh/v1"
key_env = "AI_GATEWAY_API_KEY"
# Explicit billing-risk acknowledgement. A key alone must never enroll an
# account that has purchased credits or enabled auto top-up in automatic routing.
extra_env = ["FREELLMPOOL_ENABLE_VERCEL"]
models = [
    { name = "zai/glm-5.2", rpd = 1 },
    { name = "minimax/minimax-m3", rpd = 1 },
    { name = "deepseek/deepseek-v4-pro", rpd = 1 },
    { name = "moonshotai/kimi-k2.6", rpd = 1 },
    { name = "xiaomi/mimo-v2.5-pro", rpd = 1 },
]

