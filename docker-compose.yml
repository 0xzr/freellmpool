# freellmpool + Open WebUI — a free, self-hosted ChatGPT in two containers.
#
#   docker compose up -d
#   open http://localhost:3000   (Open WebUI, talking to freellmpool)
#
# Can answer with zero API keys while an enabled keyless route is available. Add
# applicable credentials to unlock more — either export them in your shell or
# drop them in a .env file next to this one.
services:
  freellmpool:
    build: .
    # or use the published image instead of building:
    # image: ghcr.io/0xzr/freellmpool:latest
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # All optional; an empty set works while a keyless route is available.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      SAMBANOVA_API_KEY: ${SAMBANOVA_API_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
      AION_API_KEY: ${AION_API_KEY:-}
      MODELSCOPE_API_KEY: ${MODELSCOPE_API_KEY:-}
      MORPH_API_KEY: ${MORPH_API_KEY:-}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      LLM7_API_KEY: ${LLM7_API_KEY:-}
      # Require a Bearer token from clients (recommended when exposed):
      FREELLMPOOL_PROXY_KEY: ${FREELLMPOOL_PROXY_KEY:-}
    volumes:
      - freellmpool-data:/home/freellmpool/.config/freellmpool
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.10.2
    ports:
      - "127.0.0.1:3000:8080"
    environment:
      OPENAI_API_BASE_URL: http://freellmpool:8080/v1
      OPENAI_API_KEY: ${FREELLMPOOL_PROXY_KEY:-anything}
      WEBUI_AUTH: "${WEBUI_AUTH:-true}"
    depends_on:
      freellmpool:
        condition: service_healthy
    volumes:
      - open-webui:/app/backend/data
    restart: unless-stopped

volumes:
  freellmpool-data:
  open-webui:
